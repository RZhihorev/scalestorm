<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Scalestorm</title>
    </head>
    <body>
        <h1>Scalestorm</h1>

        <fieldset>
            <legend>Антропометрия</legend>

            <label for="age">Возраст (лет):</label>
            <input
                type="number"
                id="age"
                name="age"
                step="1"
                min="0"
                max="122"
            >
            <br>
            
            <label for="height">Рост (см):</label>
            <input
                type="number"
                id="height"
                name="height"
                step="1"
                min="0"
                max="250"
            >
            <br>

            <label for="weight">Вес (кг):</label>
            <input
                type="number"
                id="weight"
                name="weight"
                step="1"
                min="20"
                max="300"
            >
        </fieldset>

        <fieldset>
            <legend>Лабораторные показатели</legend>

            <label for="hemoglobin">Гемоглобин (г/л):</label>
            <input
                type="number"
                id="hemoglobin"
                name="hemoglobin"
                step="1"
                min="0"
                max="300"
            >
            <br>
            
            <label for="erythropoietin">Получает эритропоэтин</label>
            <input type="checkbox" id="erythropoietin" name="erythropoietin">
            <br>

            <label for="leukocytes">Лейкоциты (* 10^9/л):</label>
            <input
                type="number"
                id="leukocytes"
                name="leukocytes"
                step="1"
                min="0"
                max="250"
            >
            <br>

            <label for="platelets">Тромбоциты (* 10^9/л):</label>
            <input
                type="number"
                id="platelets"
                name="platelets"
                step="1"
                min="0"
                max="3000"
            >
        </fieldset>
    </body>
</html>
